services:
  - type: web
    name: medivault-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_HOST
        fromDatabase:
          name: medivault-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medivault-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medivault-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: medivault-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medivault-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://frontend-bice-nine-72.vercel.app

databases:
  - name: medivault-db
    databaseName: medivault
    user: medivault
    plan: free
    postgresMajorVersion: "16"
