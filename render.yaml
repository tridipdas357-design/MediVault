services:
  - type: web
    name: medivault-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://${{medivault-db.host}}:${{medivault-db.port}}/${{medivault-db.database}}?sslmode=require
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USERNAME
        fromDatabase:
          name: medivault-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medivault-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://frontend-bice-nine-72.vercel.app

databases:
  - name: medivault-db
    databaseName: medivault
    user: medivault
    plan: free
    postgresMajorVersion: "16"
